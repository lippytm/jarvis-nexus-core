<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title description">
<title id="title">Make one unfinished task reviewable.</title><desc id="description">The opening card selects an existing unfinished task rather than creating overlapping work.</desc>
<rect width="1080" height="1080" fill="#edf2f5"/><rect width="1080" height="164" fill="#10283f"/>
<g font-family="DejaVu Sans" fill="#10283f">
<text x="72" y="61" font-size="23" fill="#b5dbe3" letter-spacing="2">AI JARVIS • BOUNDED REVIEW</text>
<text x="72" y="121" font-size="37" fill="white">1 — Opening</text>
<text x="72" y="242" font-size="50" font-weight="bold"><tspan x="72" dy="0">Make one unfinished task</tspan><tspan x="72" dy="64">reviewable.</tspan></text>
<rect x="72" y="484" width="936" height="218" rx="12" fill="white" stroke="#b7c8d4" stroke-width="2"/><text x="96" y="518" font-size="22">Task</text><path d="M96 539 h390" stroke="#9eb3c1" stroke-width="2"/><text x="564" y="518" font-size="22">Starting version</text><path d="M564 539 h390" stroke="#9eb3c1" stroke-width="2"/><text x="96" y="586" font-size="22">Permitted action</text><path d="M96 607 h390" stroke="#9eb3c1" stroke-width="2"/><text x="564" y="586" font-size="22">Destination</text><path d="M564 607 h390" stroke="#9eb3c1" stroke-width="2"/><text x="96" y="668" font-size="23">Review decision</text><rect x="330" y="635" width="650" height="48" rx="5" fill="none" stroke="#9eb3c1" stroke-width="2"/>
<text x="72" y="771" font-size="27" font-weight="normal"><tspan x="72" dy="0">The opening card selects an existing unfinished task rather than</tspan><tspan x="72" dy="38">creating overlapping work.</tspan></text>
