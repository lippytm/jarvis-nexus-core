<text x="72" y="754" font-size="27" font-weight="normal"><tspan x="72" dy="0">The card distinguishes a retained development result from evidence</tspan><tspan x="72" dy="38">that a service is currently running.</tspan></text>
<text x="72" y="970" font-size="25">REVIEW CANDIDATE • UNPUBLISHED</text>
