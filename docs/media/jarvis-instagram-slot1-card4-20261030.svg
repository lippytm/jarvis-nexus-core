<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title description">
<title id="title">A development receipt does not establish a running service.</title><desc id="description">The card distinguishes a retained development result from evidence that a service is currently running.</desc>
<rect width="1080" height="1080" fill="#edf2f5"/><rect width="1080" height="164" fill="#10283f"/>
<g font-family="DejaVu Sans" fill="#10283f">
<text x="72" y="61" font-size="23" fill="#b5dbe3" letter-spacing="2">AI JARVIS • DEVELOPMENT EVIDENCE</text>
<text x="72" y="121" font-size="37" fill="white">4 — Limitation</text>
<text x="72" y="242" font-size="52" font-weight="bold"><tspan x="72" dy="0">A development receipt does</tspan><tspan x="72" dy="66">not establish a running service.</tspan></text>
<rect x="72" y="508" width="444" height="138" rx="12" fill="#e4eef2"/><rect x="564" y="508" width="444" height="138" rx="12" fill="#e4eef2"/><text x="96" y="585" font-size="28">Development receipt</text><text x="588" y="585" font-size="28">Running service</text><path d="M540 520 v115" stroke="#7b98aa" stroke-width="2" stroke-dasharray="8 8"/>
