<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Show the evidence with three empty conceptual cards</title>
<desc id="desc">Unpublished conceptual YouTube thumbnail candidate. Task, Revision and Receipt cards each have an empty field. Review pending and Service status: unverified remain explicit. No actual execution result, performance figure or release approval is depicted. Destination is unassigned.</desc>
<rect width="1200" height="675" fill="#101d2c"/>
<g font-family="DejaVu Sans" fill="#f5f8fc">
<rect x="64" y="224" width="340" height="184" rx="16" fill="#20354c" stroke="#b8d9e8" stroke-width="2"/><rect x="88" y="326" width="292" height="48" rx="8" fill="#344e69" stroke="#b8d9e8" stroke-width="2"/>
<rect x="430" y="224" width="340" height="184" rx="16" fill="#20354c" stroke="#b8d9e8" stroke-width="2"/><rect x="454" y="326" width="292" height="48" rx="8" fill="#344e69" stroke="#b8d9e8" stroke-width="2"/>
<rect x="796" y="224" width="340" height="184" rx="16" fill="#20354c" stroke="#b8d9e8" stroke-width="2"/><rect x="820" y="326" width="292" height="48" rx="8" fill="#344e69" stroke="#b8d9e8" stroke-width="2"/>
<text x="64" y="110" font-size="60" font-weight="bold">SHOW THE EVIDENCE</text>
<text x="64" y="170" font-size="28">One change. Actual checks.</text>
<text x="64" y="490" font-size="28" font-weight="bold">Review pending • Service status: unverified</text>
<text x="64" y="582" font-size="24">CONCEPTUAL EXAMPLE • UNPUBLISHED</text>
<text x="64" y="630" font-size="22">Destination: unassigned • No release approval depicted.</text>
<text x="88" y="292" font-size="36" font-weight="bold">Task</text>
<text x="454" y="292" font-size="36" font-weight="bold">Revision</text>
<text x="820" y="292" font-size="36" font-weight="bold">Receipt</text>
</g>
</svg>
