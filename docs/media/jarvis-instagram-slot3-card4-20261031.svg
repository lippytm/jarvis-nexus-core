<text x="72" y="242" font-size="50" font-weight="bold"><tspan x="72" dy="0">When blocked, retain the task.</tspan><tspan x="72" dy="64">Do not infer recovery from</tspan><tspan x="72" dy="64">another runner.</tspan></text>
