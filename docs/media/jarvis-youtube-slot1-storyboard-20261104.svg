<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
<title id="title">Three records for a reviewable Jarvis task: six-panel storyboard</title>
<desc id="desc">Unpublished production reference. Six panels show source, artifact and checks; a conceptual revision placeholder; an edited draft needing fresh review; empty command, context, result and checkpoint fields; separate empty service, account and delivery rows; and a remaining-gap field. No review, service, recording or delivery is claimed complete.</desc>
