<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
<title id="title">What does a passing test actually show? Six-panel storyboard</title>
<desc id="desc">Unpublished conceptual production reference. A hypothetical comparison separates a runner check from an intended local command that cannot start. Blank source fields, a blocked task and checkpoint, separate availability/access/delivery rows and a claim/source/context/gap worksheet preserve the evidence limits. No current status, recovery, retry or completed delivery is asserted.</desc>
<rect width="1200" height="1800" fill="#101d2c"/>
<g font-family="DejaVu Sans" fill="#f5f8fc">
