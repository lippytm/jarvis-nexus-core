<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title description">
  <title id="title">Evidence for one change</title>
  <desc id="description">Three cards group a code version, an exact review and a test receipt as evidence for one change. A footer says live services need separate verification. Explanatory illustration, not an executed-task screenshot.</desc>
  <rect width="1200" height="1200" fill="#edf2f5"/>
  <rect width="1200" height="240" fill="#10283f"/>
  <g font-family="DejaVu Sans" fill="#ffffff">
    <text x="72" y="82" font-size="25" letter-spacing="2">JARVIS • DEVELOPMENT EVIDENCE</text>
    <text x="72" y="158" font-size="51" font-weight="bold">Evidence for one change</text>
    <text x="72" y="206" font-size="26">Explanatory illustration • not a test receipt</text>
  </g>
  <g fill="#ffffff" stroke="#becbd5" stroke-width="2">
    <rect x="72" y="290" width="1056" height="170" rx="20"/>
    <rect x="72" y="490" width="1056" height="170" rx="20"/>
    <rect x="72" y="690" width="1056" height="170" rx="20"/>
  </g>
  <g fill="none" stroke="#215477" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M130 350 l-20 25 20 25 M190 350 l20 25 -20 25 M168 344 l-16 62"/>
    <rect x="123" y="526" width="76" height="98" rx="8"/>
    <path d="M143 552 h36 M143 575 h36 M143 598 h22"/>
    <path d="M125 728 h75 v100 l-12 -9 -12 9 -13 -9 -13 9 -13 -9 -12 9 Z M144 754 h37 M144 777 h37 M144 800 h23"/>
  </g>
  <g font-family="DejaVu Sans" fill="#10283f" font-size="52" font-weight="bold">
