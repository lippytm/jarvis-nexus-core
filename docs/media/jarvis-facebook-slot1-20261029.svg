    <text x="258" y="594">Exact review</text>
    <text x="258" y="794">Test receipt</text>
  </g>
  <rect x="72" y="922" width="1056" height="126" rx="18" fill="#10283f"/>
  <text x="600" y="996" text-anchor="middle" font-family="DejaVu Sans" font-size="39" fill="#ffffff">Live service: separate verification</text>
  <text x="72" y="1120" font-family="DejaVu Sans" font-size="25" fill="#334c61">Review candidate • unpublished • owner approval pending</text>
