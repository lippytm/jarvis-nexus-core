<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">One conceptual handoff: three references and undecided review</title>
  <desc id="desc">Unpublished Threads slot-1 production candidate. Three rows labelled Starting revision, Changed artifact and Actual checks have deliberately empty reference fields. The owner-review field is also empty. Destination is unassigned. No check result, running service, completed review or release is depicted.</desc>
  <rect width="1080" height="1080" fill="#101d2c"/>
  <g font-family="DejaVu Sans" fill="#f5f8fc">
    <text x="48" y="70" font-size="34" font-weight="bold">ONE HANDOFF. THREE REFERENCES.</text>
    <text x="48" y="110" font-size="22" fill="#a9e0df">CONCEPTUAL EXAMPLE • UNPUBLISHED DRAFT</text>
    <text x="48" y="154" font-size="22" fill="#b8d9e8">Keep source, artifact and check references together.</text>
    <g>
      <rect x="48" y="198" width="984" height="160" rx="16" fill="#20354c"/>
      <text x="72" y="244" font-size="28" font-weight="bold">Starting revision</text>
      <rect x="72" y="268" width="936" height="58" rx="8" fill="#344e69" stroke="#b8d9e8" stroke-width="2"/>
    </g>
    <g>
      <rect x="48" y="382" width="984" height="160" rx="16" fill="#20354c"/>
      <text x="72" y="428" font-size="28" font-weight="bold">Changed artifact</text>
      <rect x="72" y="452" width="936" height="58" rx="8" fill="#344e69" stroke="#b8d9e8" stroke-width="2"/>
    </g>
    <g>
      <rect x="48" y="566" width="984" height="160" rx="16" fill="#20354c"/>
      <text x="72" y="612" font-size="28" font-weight="bold">Actual checks</text>
      <rect x="72" y="636" width="936" height="58" rx="8" fill="#344e69" stroke="#b8d9e8" stroke-width="2"/>
    </g>
    <rect x="48" y="766" width="984" height="104" rx="16" fill="#20354c"/>
    <text x="72" y="825" font-size="26">Owner review:</text>
    <rect x="314" y="790" width="668" height="54" rx="8" fill="#344e69" stroke="#b8d9e8" stroke-width="2"/>
    <text x="48" y="924" font-size="24" fill="#b8d9e8">Reference fields are intentionally empty.</text>
    <text x="48" y="970" font-size="22" fill="#b8d9e8">Destination: unassigned • No actual check result depicted.</text>
    <text x="48" y="1022" font-size="21" fill="#b8d9e8">A saved draft does not establish a running service or release approval.</text>
  </g>
</svg>
