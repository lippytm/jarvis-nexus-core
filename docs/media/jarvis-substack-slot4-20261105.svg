<g font-family="DejaVu Sans" fill="#f5f8fc">
<rect x="64" y="264" width="1272" height="104" rx="14" fill="#20354c"/><rect x="94" y="286" width="60" height="60" rx="4" fill="#344e69" stroke="#b8d9e8" stroke-width="3"/>
<rect x="64" y="388" width="1272" height="104" rx="14" fill="#20354c"/><rect x="94" y="410" width="60" height="60" rx="4" fill="#344e69" stroke="#b8d9e8" stroke-width="3"/>
<rect x="64" y="512" width="1272" height="104" rx="14" fill="#20354c"/><rect x="94" y="534" width="60" height="60" rx="4" fill="#344e69" stroke="#b8d9e8" stroke-width="3"/>
<rect x="64" y="636" width="1272" height="104" rx="14" fill="#20354c"/><rect x="94" y="658" width="60" height="60" rx="4" fill="#344e69" stroke="#b8d9e8" stroke-width="3"/>
<text x="64" y="84" font-size="40" font-weight="bold">ONE TASK. A REVIEWABLE RETURN.</text>
<text x="64" y="138" font-size="26">CONCEPTUAL EXAMPLE • UNPUBLISHED NOTE</text>
