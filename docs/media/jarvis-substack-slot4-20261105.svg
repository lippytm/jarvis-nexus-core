<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">A blank draft return checklist</title>
<desc id="desc">Unpublished conceptual Substack artwork. Draft only appears above four empty checkboxes labelled Artifact, Actual checks, Unresolved limits and Next action. Blank boxes do not imply completion or approval. Review pending; destination unassigned. No mission dispatch or release decision is depicted.</desc>
