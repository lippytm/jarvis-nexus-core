<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">Three independent claims need three evidence records</title>
  <desc id="desc">Conceptual unpublished Threads slot-3 artwork. Independent rows distinguish Artifact, CI runner and Intended runtime. Each has its own deliberately empty evidence-reference field. Owner review is empty and destination unassigned. No actual check result, availability claim, success arrow, online indicator or uptime chart is depicted.</desc>
  <rect width="1080" height="1080" fill="#101d2c"/>
  <g font-family="DejaVu Sans" fill="#f5f8fc">
    <text x="48" y="70" font-size="34" font-weight="bold">THREE CLAIMS. THREE RECORDS.</text>
    <text x="48" y="112" font-size="22" fill="#a9e0df">CONCEPTUAL EXAMPLE • UNPUBLISHED DRAFT</text>
    <text x="48" y="164" font-size="22" fill="#b8d9e8">Each claim needs evidence from its own context.</text>
    <rect x="48" y="208" width="984" height="166" rx="16" fill="#20354c"/>
    <text x="72" y="250" font-size="28" font-weight="bold">Artifact</text>
    <text x="72" y="292" font-size="22">Retained file + exact revision reference</text>
    <rect x="72" y="312" width="936" height="40" rx="8" fill="#344e69" stroke="#b8d9e8" stroke-width="2"/>
    <rect x="48" y="400" width="984" height="166" rx="16" fill="#20354c"/>
    <text x="72" y="442" font-size="28" font-weight="bold">CI runner</text>
    <text x="72" y="484" font-size="22">Named check + runner + result reference</text>
    <rect x="72" y="504" width="936" height="40" rx="8" fill="#344e69" stroke="#b8d9e8" stroke-width="2"/>
    <rect x="48" y="592" width="984" height="166" rx="16" fill="#20354c"/>
    <text x="72" y="634" font-size="28" font-weight="bold">Intended runtime</text>
    <text x="72" y="676" font-size="22">Actual command + intended context reference</text>
    <rect x="72" y="696" width="936" height="40" rx="8" fill="#344e69" stroke="#b8d9e8" stroke-width="2"/>
    <rect x="48" y="794" width="984" height="104" rx="16" fill="#20354c"/>
    <text x="72" y="856" font-size="26">Owner review:</text>
    <rect x="314" y="818" width="668" height="54" rx="8" fill="#344e69" stroke="#b8d9e8" stroke-width="2"/>
    <text x="48" y="956" font-size="22" fill="#b8d9e8">Reference fields are empty • Destination: unassigned</text>
    <text x="48" y="1014" font-size="21" fill="#b8d9e8">No actual check result, service availability or release approval depicted.</text>
  </g>
</svg>
