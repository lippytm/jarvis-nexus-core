<title id="title">Make one unfinished task reviewable: six-panel storyboard</title>
<desc id="desc">Unpublished synthetic exercise. Six panels show empty task/receipt/active-work fields, bounded outcome/source/action/unassigned destination fields, minimal synthetic context, empty artifact/checks/gap rows, a conceptual blocked task and retained checkpoint, and an empty owner-review field beside a closed release gate. No task is dispatched, approved or released.</desc>
