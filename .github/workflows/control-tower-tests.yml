name: Control Tower Sandbox Tests
on:
  pull_request:
  push:
    branches: [feature/control-tower-foundation-20261021]
permissions:
  contents: read
concurrency:
  group: control-tower-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-22
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, resolved 2026-10-22
        with:
          python-version: '3.11'
      - name: Run offline deterministic tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/verify_control_tower.py
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, resolved 2026-10-22
        with:
          name: control-tower-evidence-${{ github.sha }}
          path: reports/control_tower_verification.*
          retention-days: 14
          if-no-files-found: warn
