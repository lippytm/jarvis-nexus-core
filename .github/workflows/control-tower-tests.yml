name: Control Tower Sandbox Tests
on:
  pull_request:
  push:
    branches: [feature/control-tower-foundation-20261021]
permissions:
  contents: read
concurrency:
  group: control-tower-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, resolved 2026-10-22
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, resolved 2026-10-22
        with:
          python-version: '3.11'
      - name: Run offline deterministic tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/verify_control_tower.py
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, resolved 2026-10-22
        with:
          name: control-tower-evidence-${{ github.sha }}
          path: reports/control_tower_verification.*
          retention-days: 14
          if-no-files-found: warn
  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, resolved 2026-10-22
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test composer and portfolio workbench contracts
        shell: bash
        run: |
          mkdir -p reports
          node --test --test-reporter=tap tests/*.mjs 2>&1 | tee reports/web-tests.txt
      - name: Preserve web test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-evidence-${{ github.sha }}
          path: reports/web-tests.txt
          retention-days: 14
          if-no-files-found: warn
