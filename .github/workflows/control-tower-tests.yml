name: Control Tower Sandbox Tests
on:
  pull_request:
  push:
    branches: [feature/control-tower-foundation-20261021]
permissions:
  contents: read
concurrency:
  group: control-tower-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, resolved 2026-10-22
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, resolved 2026-10-22
        with:
          python-version: '3.11'
      - name: Run offline deterministic tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/verify_control_tower.py
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, resolved 2026-10-22
        with:
          name: control-tower-evidence-${{ github.sha }}
          path: reports/control_tower_verification.*
          retention-days: 14
          if-no-files-found: warn
  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, resolved 2026-10-22
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test composer and portfolio workbench contracts
        shell: bash
        run: |
          mkdir -p reports
          node --test --test-reporter=tap tests/*.mjs 2>&1 | tee reports/web-tests.txt
      - name: Preserve web test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-evidence-${{ github.sha }}
          path: reports/web-tests.txt
          retention-days: 14
          if-no-files-found: warn
  docker-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build development container and validate Compose
        run: |
          docker compose config --quiet
          docker build --progress=plain -t jarvis-nexus-ci .
      - name: Verify context behavior inside restricted container
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges jarvis-nexus-ci python -m unittest discover -s tests -p 'test_handoff_context*.py' -v
      - name: Verify explicit first-run Compose initialization
        shell: bash
        run: |
          set -euo pipefail
          project="jarvis-bootstrap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker compose -p "$project" down -v' EXIT
          docker tag jarvis-nexus-ci jarvis-nexus-local:development
          if docker compose -p "$project" run --rm --no-deps jarvis; then
            echo "ERROR: missing ledger reported successful status"
            exit 1
          fi
          docker compose -p "$project" run --rm --no-deps jarvis python scripts/jarvis_network.py --root /data --database handoffs.sqlite3 init-ledger
          docker compose -p "$project" run --rm --no-deps jarvis
          if docker compose -p "$project" run --rm --no-deps jarvis python scripts/jarvis_network.py --root /data --database handoffs.sqlite3 init-ledger; then
            echo "ERROR: initialization accepted an existing ledger"
            exit 1
          fi
          docker compose -p "$project" run --rm --no-deps jarvis
          echo "PASS: explicit Compose bootstrap and repeated status"
      - name: Preserve a synthetic handoff across container replacement
        shell: bash
        run: |
          set -euo pipefail
          volume="jarvis-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$volume"
          trap 'docker volume rm "$volume"' EXIT
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges -v "$volume:/data" jarvis-nexus-ci python -c '
          from control_tower.handoffs import HandoffLedger
          from control_tower.swarm_factory import build_swarm
          draft = dict(schema_version=1, kind="jarvis.draft", project_id="ai-jarvis", target="codex", text="Synthetic container restart fixture.")
          swarm = build_swarm("ai-jarvis", ["codex"], swarm_id="docker-pilot", source_revision="4360784edb85d70c38c90caaeb42fc1a4403979c")
          with HandoffLedger("/data/handoffs.sqlite3") as ledger:
              receipt = ledger.stage(draft, swarm, assistant_id="docker-pilot.builder", handoff_id="docker-mission")
              open("/data/expected-digest.txt", "w").write(receipt["handoff_sha256"])
              print("Synthetic handoff staged:", receipt["handoff_sha256"])
          '
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges -v "$volume:/data" jarvis-nexus-ci python -c '
          from control_tower.handoffs import HandoffLedger
          with HandoffLedger("/data/handoffs.sqlite3") as ledger:
              rows = ledger.status()["handoffs"]
              assert len(rows) == 1 and rows[0]["handoff_id"] == "docker-mission"
              assert rows[0]["handoff_sha256"] == open("/data/expected-digest.txt").read()
              assert ledger.db.execute("PRAGMA user_version").fetchone()[0] == 2
              print("PASS: replacement container retained the exact handoff; schema=2")
          '
